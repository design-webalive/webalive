<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/webcommander-design-system-d41e7544-88b3-427f-9185-395e0e4336fb/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/webcommander-design-system-d41e7544-88b3-427f-9185-395e0e4336fb/tokens/colors.css">
  <link rel="stylesheet" href="_ds/webcommander-design-system-d41e7544-88b3-427f-9185-395e0e4336fb/tokens/typography.css">
  <link rel="stylesheet" href="_ds/webcommander-design-system-d41e7544-88b3-427f-9185-395e0e4336fb/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/webcommander-design-system-d41e7544-88b3-427f-9185-395e0e4336fb/tokens/radius.css">
  <link rel="stylesheet" href="_ds/webcommander-design-system-d41e7544-88b3-427f-9185-395e0e4336fb/tokens/elevation.css">
  <link rel="stylesheet" href="_ds/webcommander-design-system-d41e7544-88b3-427f-9185-395e0e4336fb/tokens/base.css">
  <link rel="stylesheet" href="_ds/webcommander-design-system-d41e7544-88b3-427f-9185-395e0e4336fb/styles.css">
  <script src="https://unpkg.com/lucide@0.417.0/dist/umd/lucide.js"></script>
  <script src="_ds/webcommander-design-system-d41e7544-88b3-427f-9185-395e0e4336fb/_ds_bundle.js"></script>
  <style>html,body{margin:0;height:100%;background:#eef1f3;font-family:'Source Sans 3',sans-serif;color:#1a1f26}a{color:#008DF2;text-decoration:none}a:hover{color:#0077cf;text-decoration:underline}</style>
</helmet>
<div style="display:grid;grid-template-rows:50px minmax(0,1fr);height:100vh;min-height:600px">
  <x-import component-from-global-scope="WebCommanderDesignSystem_d41e75.TopBar" title="Plugins" icon="puzzle" logo="{{ logo }}" credits="{{ credits }}" right="{{ topRight }}" hint-size="100%,50px"></x-import>
  <div style="display:grid;grid-template-columns:80px minmax(0,1fr);min-height:0">
    <x-import component-from-global-scope="WebCommanderDesignSystem_d41e75.SidebarNav" active="plugins" version="8.0.0" hint-size="80px,100%"></x-import>
    <main style="overflow:auto;padding:16px 24px 24px">
      <div style="background:#fff;border:1px solid #e5e7eb;border-radius:8px;box-shadow:0 1px 2px rgba(16,24,40,.04);min-height:calc(100% - 2px);display:flex;flex-direction:column">
        <div style="display:flex;align-items:center;gap:12px;padding:22px 30px 4px">
          <x-import component-from-global-scope="WebCommanderDesignSystem_d41e75.IconButton" icon="arrow-left" variant="plain" size="32" label="Back to Plugins" hint-size="32px,32px"></x-import>
          <h1 style="margin:0;font-size:22px;font-weight:600;line-height:28px">Popups</h1>
          <span style="font-size:13px;color:#6b7480;border-left:1px solid #e5e7eb;padding-left:12px">{{ countLabel }}</span>
        </div>
        <div style="padding:0 30px 0 74px;font-size:13px;color:#6b7480">Show offers, sign-up forms and announcements to visitors on your storefront.</div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:20px 30px 16px">
          <x-import component-from-global-scope="WebCommanderDesignSystem_d41e75.SearchInput" placeholder="Search popup" value="{{ query }}" on-change="{{ onSearch }}" width="260" hint-size="260px,34px"></x-import>
          <x-import component-from-global-scope="WebCommanderDesignSystem_d41e75.Select" value="{{ typeFilter }}" options="{{ typeOptions }}" on-change="{{ onType }}" shape="pill" size="sm" width="150" hint-size="150px,34px"></x-import>
          <x-import component-from-global-scope="WebCommanderDesignSystem_d41e75.Select" value="{{ statusFilter }}" options="{{ statusOptions }}" on-change="{{ onStatus }}" shape="pill" size="sm" width="140" hint-size="140px,34px"></x-import>
          <x-import component-from-global-scope="WebCommanderDesignSystem_d41e75.IconButton" icon="refresh-cw" size="34" label="Refresh" hint-size="34px,34px"></x-import>
          <div style="flex:1"></div>
          <x-import component-from-global-scope="WebCommanderDesignSystem_d41e75.Button" variant="primary" on-click="{{ addPopup }}" hint-size="140px,36px">+ Create Popup</x-import>
        </div>
        <sc-if value="{{ hasSelection }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;align-items:center;gap:8px;margin:0 30px 12px;padding:6px 8px 6px 16px;background:#eef6fe;border-radius:8px;font-size:13px">
            <span style="font-weight:600;margin-right:8px">{{ selectionLabel }}</span>
            <x-import component-from-global-scope="WebCommanderDesignSystem_d41e75.Button" variant="ghost" size="sm" icon="eye" on-click="{{ bulkOn }}" hint-size="90px,28px">Activate</x-import>
            <x-import component-from-global-scope="WebCommanderDesignSystem_d41e75.Button" variant="ghost" size="sm" icon="eye-off" on-click="{{ bulkOff }}" hint-size="90px,28px">Deactivate</x-import>
            <x-import component-from-global-scope="WebCommanderDesignSystem_d41e75.Button" variant="ghost" size="sm" icon="trash-2" on-click="{{ bulkDelete }}" hint-size="80px,28px">Delete</x-import>
            <div style="flex:1"></div>
            <x-import component-from-global-scope="WebCommanderDesignSystem_d41e75.Button" variant="link" size="sm" on-click="{{ clearSel }}" hint-size="60px,28px">Clear</x-import>
          </div>
        </sc-if>
        <div style="flex:1;overflow-x:auto">
          <x-import style="min-width:1080px" component-from-global-scope="WebCommanderDesignSystem_d41e75.DataTable" columns="{{ columns }}" rows="{{ rows }}" selectable="{{ true }}" selected="{{ selected }}" on-select="{{ onSelect }}" sort-key="{{ sortKey }}" sort-dir="{{ sortDir }}" on-sort="{{ onSort }}" row-height="{{ rowHeight }}" column-dividers="{{ true }}" row-actions="{{ true }}" gutter="{{ 30 }}" empty="{{ empty }}" min-body-height="{{ 320 }}" hint-size="100%,360px"></x-import>
        </div>
        <div style="display:flex;align-items:center;gap:10px;padding:16px 30px 22px;border-top:1px solid #e9edf0;font-size:13px;color:#6b7480">
          <x-import component-from-global-scope="WebCommanderDesignSystem_d41e75.Select" value="10" options="{{ pageSizes }}" size="sm" width="76" hint-size="76px,32px"></x-import>
          <span>per page</span>
          <div style="flex:1"></div>
          <span>{{ footerLabel }}</span>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Comfortable&quot;,&quot;Compact&quot;],&quot;default&quot;:&quot;Comfortable&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;forceEmpty&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const SEED = [
  { id: 1, name: 'Watch this demo video', type: 'Snippet', pages: 'Home page', trigger: 'On page load', created: '20 Jul 2026 11:27:58', active: true },
  { id: 2, name: 'Spring sale — 20% off sitewide', type: 'Image', pages: 'All pages', trigger: 'After 5 seconds', created: '02 Sep 2026 09:14:02', active: true },
  { id: 3, name: 'Join our newsletter', type: 'Newsletter', pages: 'Blog pages', trigger: 'Scroll 50%', created: '14 Aug 2026 16:40:21', active: false },
  { id: 4, name: 'Free shipping over $99', type: 'Text', pages: 'Product pages', trigger: 'On exit intent', created: '28 Aug 2026 13:05:47', active: true },
  { id: 5, name: 'Age verification', type: 'Snippet', pages: 'Category: Wine', trigger: 'On page load', created: '11 Jun 2026 10:22:10', active: false },
];
class Component extends DCLogic {
  state = { items: SEED, query: '', typeFilter: 'All types', statusFilter: 'Any status', selected: [], sortKey: 'created', sortDir: 'desc' };
  set = (patch) => this.setState(patch);
  toggle = (id) => this.setState(s => ({ items: s.items.map(r => r.id === id ? { ...r, active: !r.active } : r) }));
  bulk = (fn) => this.setState(s => ({ items: fn(s.items, s.selected), selected: [] }));
  renderVals() {
    const DS = window.WebCommanderDesignSystem_d41e75 || {};
    const h = React.createElement;
    const { items, query, typeFilter, statusFilter, selected, sortKey, sortDir } = this.state;
    const showEmpty = this.props.forceEmpty;
    const q = query.trim().toLowerCase();
    let rows = showEmpty ? [] : items.filter(r =>
      (!q || r.name.toLowerCase().includes(q)) &&
      (typeFilter === 'All types' || r.type === typeFilter) &&
      (statusFilter === 'Any status' || (statusFilter === 'Active') === r.active));
    const parse = d => new Date(d.replace(/(\d+) (\w+) (\d+)/, '$2 $1 $3')).getTime();
    rows = [...rows].sort((a, b) => {
      const v = sortKey === 'created' ? parse(a.created) - parse(b.created) : String(a[sortKey]).localeCompare(String(b[sortKey]));
      return sortDir === 'asc' ? v : -v;
    });
    const muted = { fontSize: 13, color: '#6b7480' };
    const columns = [
      { key: 'name', header: 'Name', width: 'minmax(220px,2.2fr)', sortable: true, render: r => h('a', { href: '#', onClick: e => e.preventDefault(), style: { fontWeight: 600 } }, r.name) },
      { key: 'type', header: 'Type', width: 'minmax(120px,0.9fr)', sortable: true },
      { key: 'pages', header: 'Shown on', width: 'minmax(140px,1.1fr)', render: r => h('span', { style: { whiteSpace: 'nowrap' } }, r.pages) },
      { key: 'trigger', header: 'Trigger', width: 'minmax(130px,1fr)', render: r => h('span', { style: { ...muted, whiteSpace: 'nowrap' } }, r.trigger) },
      { key: 'created', header: 'Created', width: 'minmax(170px,1.3fr)', sortable: true },
      { key: 'active', header: 'Status', width: '130px', render: r => DS.Switch ? h('div', { style: { display: 'flex', alignItems: 'center', gap: 8 } },
          h(DS.Switch, { checked: r.active, size: 'sm', onChange: () => this.toggle(r.id) }),
          h('span', { style: { fontSize: 13, color: r.active ? '#1a1f26' : '#8b949e' } }, r.active ? 'Active' : 'Inactive')) : null },
    ];
    const total = items.length;
    const activeCount = items.filter(r => r.active).length;
    const filtered = q || typeFilter !== 'All types' || statusFilter !== 'Any status';
    const empty = DS.EmptyState ? h(DS.EmptyState, filtered && !showEmpty
      ? { icon: 'search-x', title: 'No popups match your filters', description: 'Try a different name, type or status.', action: h(DS.Button, { variant: 'secondary', size: 'sm', onClick: () => this.set({ query: '', typeFilter: 'All types', statusFilter: 'Any status' }) }, 'Clear filters') }
      : { icon: 'message-square-plus', title: 'No popups yet', description: 'Create a popup to show offers or sign-up forms on your storefront.', action: h(DS.Button, { variant: 'primary', size: 'sm' }, '+ Create Popup') }) : null;
    return {
      logo: h('img', { src: 'assets/logo-mark.png', alt: 'WebCommander', style: { width: 32 } }),
      credits: { label: 'AI credits', used: 120, total: 500 },
      topRight: DS.Button ? h('div', { style: { display: 'flex', alignItems: 'center', gap: 10 } },
        h(DS.Button, { variant: 'secondary', size: 'sm', icon: 'external-link' }, 'View Site'),
        h(DS.IconButton, { icon: 'bell', variant: 'plain', size: 34, label: 'Notifications' }),
        h(DS.IconButton, { icon: 'user', size: 34, label: 'Account' })) : null,
      countLabel: showEmpty ? '0 items' : `${total} items · ${activeCount} active`,
      query, typeFilter, statusFilter,
      typeOptions: ['All types', 'Snippet', 'Image', 'Text', 'Newsletter'],
      statusOptions: ['Any status', 'Active', 'Inactive'],
      pageSizes: ['10', '25', '50'],
      onSearch: e => this.set({ query: e.target.value }),
      onType: e => this.set({ typeFilter: e.target.value }),
      onStatus: e => this.set({ statusFilter: e.target.value }),
      addPopup: () => {},
      columns, rows, selected, sortKey, sortDir,
      rowHeight: this.props.density === 'Compact' ? 44 : 56,
      onSelect: next => this.set({ selected: next }),
      onSort: key => this.setState(s => ({ sortKey: key, sortDir: s.sortKey === key && s.sortDir === 'asc' ? 'desc' : 'asc' })),
      empty,
      hasSelection: selected.length > 0,
      selectionLabel: `${selected.length} selected`,
      bulkOn: () => this.bulk((it, sel) => it.map(r => sel.includes(r.id) ? { ...r, active: true } : r)),
      bulkOff: () => this.bulk((it, sel) => it.map(r => sel.includes(r.id) ? { ...r, active: false } : r)),
      bulkDelete: () => this.bulk((it, sel) => it.filter(r => !sel.includes(r.id))),
      clearSel: () => this.set({ selected: [] }),
      footerLabel: rows.length ? `Showing 1–${rows.length} of ${rows.length}` : '',
    };
  }
}
</script>
</body>
</html>
